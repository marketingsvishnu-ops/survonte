<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOLT X — Cyber Fitness</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    :root{
      --orange:#ff5a00;
      --orange2:#ff8a00;
      --black:#080808;
      --dark:#111;
      --gray:#9a9a9a;
      --white:#f5f5f5;
      --line:rgba(255,255,255,.1);
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      background:var(--black);
      color:var(--white);
      font-family:Inter,sans-serif;
      overflow-x:hidden;
    }

    body:before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.035;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      z-index:999;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    .container{
      width:min(1180px,92%);
      margin:auto;
    }

    /* NAVBAR */

    nav{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      z-index:1000;
      padding:22px 0;
      background:rgba(8,8,8,.75);
      backdrop-filter:blur(15px);
      border-bottom:1px solid var(--line);
    }

    .nav-inner{
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .logo{
      font-family:"Barlow Condensed",sans-serif;
      font-size:34px;
      font-weight:900;
      letter-spacing:-1px;
    }

    .logo span{
      color:var(--orange);
    }

    .nav-links{
      display:flex;
      gap:34px;
      font-size:13px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:1px;
    }

    .nav-links a{
      transition:.3s;
    }

    .nav-links a:hover{
      color:var(--orange);
    }

    .nav-btn{
      background:var(--orange);
      padding:13px 21px;
      color:#000;
      font-weight:800;
      font-size:12px;
      text-transform:uppercase;
      clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
    }

    /* HERO */

    .hero{
      min-height:100vh;
      padding-top:120px;
      display:flex;
      align-items:center;
      position:relative;
      overflow:hidden;
    }

    .hero-grid{
      display:grid;
      grid-template-columns:1.1fr .9fr;
      gap:50px;
      align-items:center;
    }

    .hero:after{
      content:"";
      position:absolute;
      width:600px;
      height:600px;
      right:-200px;
      top:80px;
      background:radial-gradient(circle,rgba(255,90,0,.25),transparent 65%);
      pointer-events:none;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:10px;
      color:var(--orange);
      font-size:12px;
      font-weight:800;
      letter-spacing:3px;
      text-transform:uppercase;
      margin-bottom:20px;
    }

    .eyebrow:before{
      content:"";
      width:35px;
      height:2px;
      background:var(--orange);
    }

    h1{
      font-family:"Barlow Condensed",sans-serif;
      font-size:clamp(75px,10vw,150px);
      line-height:.8;
      text-transform:uppercase;
      font-weight:900;
      letter-spacing:-4px;
    }

    h1 span{
      color:var(--orange);
      display:block;
    }

    .hero-text{
      margin-top:30px;
      color:#aaa;
      max-width:520px;
      line-height:1.8;
      font-size:15px;
    }

    .hero-actions{
      display:flex;
      gap:15px;
      margin-top:35px;
    }

    .btn{
      display:inline-block;
      padding:17px 27px;
      font-size:12px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:1px;
      transition:.3s;
    }

    .btn-orange{
      background:var(--orange);
      color:#000;
    }

    .btn-orange:hover{
      background:#fff;
      transform:translateY(-4px);
    }

    .btn-outline{
      border:1px solid #444;
    }

    .btn-outline:hover{
      border-color:var(--orange);
      color:var(--orange);
    }

    /* HERO VISUAL */

    .hero-visual{
      position:relative;
      height:560px;
    }

    .main-card{
      position:absolute;
      right:0;
      top:25px;
      width:390px;
      height:500px;
      background:
        linear-gradient(135deg,rgba(255,90,0,.12),transparent 40%),
        #151515;
      border:1px solid #333;
      transform:skewY(-4deg);
      overflow:hidden;
      box-shadow:25px 30px 80px rgba(0,0,0,.6);
    }

    .main-card:before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(110deg,transparent 40%,rgba(255,90,0,.18),transparent 60%);
      animation:shine 4s infinite;
    }

    @keyframes shine{
      0%,60%{transform:translateX(-100%);}
      100%{transform:translateX(100%);}
    }

    .card-lines{
      position:absolute;
      inset:20px;
      border:1px solid rgba(255,255,255,.08);
    }

    .card-number{
      position:absolute;
      top:30px;
      left:30px;
      font-family:"Barlow Condensed";
      font-size:15px;
      color:#777;
      letter-spacing:3px;
    }

    .card-x{
      position:absolute;
      right:30px;
      top:15px;
      font-family:"Barlow Condensed";
      font-size:160px;
      line-height:1;
      color:var(--orange);
      opacity:.9;
      font-weight:900;
    }

    .card-info{
      position:absolute;
      bottom:35px;
      left:35px;
    }

    .card-info strong{
      display:block;
      font-family:"Barlow Condensed";
      font-size:52px;
      text-transform:uppercase;
    }

    .card-info small{
      color:#999;
      letter-spacing:3px;
    }

    .floating-box{
      position:absolute;
      background:#101010;
      border:1px solid #333;
      padding:20px;
      z-index:3;
      box-shadow:15px 20px 40px rgba(0,0,0,.4);
    }

    .floating-box.one{
      left:0;
      top:100px;
    }

    .floating-box.two{
      left:35px;
      bottom:70px;
    }

    .floating-box span{
      display:block;
      font-size:10px;
      color:#777;
      text-transform:uppercase;
      letter-spacing:2px;
      margin-bottom:8px;
    }

    .floating-box strong{
      font-family:"Barlow Condensed";
      font-size:32px;
    }

    .orange-dot{
      display:inline-block;
      width:8px;
      height:8px;
      background:var(--orange);
      border-radius:50%;
      margin-right:8px;
      box-shadow:0 0 15px var(--orange);
    }

    /* MARQUEE */

    .marquee{
      border-top:1px solid var(--line);
      border-bottom:1px solid var(--line);
      overflow:hidden;
      white-space:nowrap;
      padding:18px 0;
      background:#0d0d0d;
    }

    .marquee-track{
      display:inline-block;
      animation:move 20s linear infinite;
      font-family:"Barlow Condensed";
      font-size:25px;
      font-weight:800;
      text-transform:uppercase;
    }

    .marquee-track span{
      color:var(--orange);
      margin:0 30px;
    }

    @keyframes move{
      from{transform:translateX(0);}
      to{transform:translateX(-50%);}
    }

    /* SECTION */

    section{
      padding:110px 0;
    }

    .section-head{
      display:flex;
      justify-content:space-between;
      align-items:end;
      margin-bottom:55px;
      gap:30px;
    }

    .section-label{
      color:var(--orange);
      text-transform:uppercase;
      font-size:11px;
      font-weight:800;
      letter-spacing:3px;
      margin-bottom:12px;
    }

    h2{
      font-family:"Barlow Condensed";
      font-size:70px;
      line-height:.9;
      text-transform:uppercase;
      font-weight:900;
    }

    .section-desc{
      max-width:400px;
      color:#888;
      line-height:1.7;
      font-size:14px;
    }

    /* PROGRAMS */

    .program-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:2px;
    }

    .program{
      min-height:350px;
      padding:35px;
      background:#111;
      border:1px solid #222;
      position:relative;
      overflow:hidden;
      transition:.4s;
    }

    .program:hover{
      background:#171717;
      transform:translateY(-8px);
      border-color:var(--orange);
    }

    .program-number{
      font-family:"Barlow Condensed";
      color:#444;
      font-size:60px;
      font-weight:900;
    }

    .program-icon{
      font-size:40px;
      color:var(--orange);
      margin:35px 0 20px;
    }

    .program h3{
      font-family:"Barlow Condensed";
      font-size:35px;
      text-transform:uppercase;
    }

    .program p{
      color:#777;
      font-size:13px;
      line-height:1.7;
      margin-top:10px;
    }

    .program-arrow{
      position:absolute;
      right:25px;
      bottom:20px;
      color:var(--orange);
      font-size:28px;
    }

    /* DASHBOARD */

    .dashboard{
      background:#101010;
      border:1px solid #292929;
      padding:35px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:35px;
    }

    .dash-main{
      min-height:330px;
      background:#151515;
      padding:30px;
      position:relative;
      overflow:hidden;
    }

    .dash-title{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:35px;
    }

    .dash-title h3{
      font-family:"Barlow Condensed";
      font-size:30px;
      text-transform:uppercase;
    }

    .live{
      color:var(--orange);
      font-size:10px;
      font-weight:800;
      letter-spacing:2px;
    }

    .bars{
      height:180px;
      display:flex;
      align-items:end;
      gap:10px;
    }

    .bar{
      flex:1;
      background:linear-gradient(to top,var(--orange),#ffb067);
      height:var(--h);
      position:relative;
      animation:barPulse 2s infinite alternate;
    }

    .bar:after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      top:0;
      height:2px;
      background:#fff;
    }

    @keyframes barPulse{
      from{opacity:.65;}
      to{opacity:1;}
    }

    .day-labels{
      display:flex;
      gap:10px;
      margin-top:12px;
      color:#555;
      font-size:10px;
    }

    .day-labels span{
      flex:1;
      text-align:center;
    }

    .metrics{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:2px;
    }

    .metric{
      background:#151515;
      padding:30px;
      border:1px solid #202020;
    }

    .metric small{
      color:#666;
      text-transform:uppercase;
      letter-spacing:2px;
      font-size:9px;
    }

    .metric strong{
      display:block;
      font-family:"Barlow Condensed";
      font-size:48px;
      margin-top:15px;
    }

    .metric strong span{
      color:var(--orange);
      font-size:20px;
    }

    /* STATS */

    .stats{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      border-top:1px solid #222;
      border-bottom:1px solid #222;
    }

    .stat{
      padding:40px 25px;
      text-align:center;
      border-right:1px solid #222;
    }

    .stat:last-child{
      border-right:0;
    }

    .stat strong{
      font-family:"Barlow Condensed";
      font-size:65px;
      color:var(--orange);
    }

    .stat span{
      display:block;
      color:#777;
      font-size:10px;
      letter-spacing:2px;
      text-transform:uppercase;
    }

    /* PRICING */

    .pricing{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:20px;
    }

    .price-card{
      background:#111;
      border:1px solid #292929;
      padding:35px;
      position:relative;
      transition:.3s;
    }

    .price-card.featured{
      border-color:var(--orange);
      transform:translateY(-12px);
    }

    .popular{
      position:absolute;
      top:0;
      right:0;
      background:var(--orange);
      color:#000;
      padding:9px 16px;
      font-size:9px;
      font-weight:900;
      text-transform:uppercase;
    }

    .price-card h3{
      font-family:"Barlow Condensed";
      font-size:32px;
      text-transform:uppercase;
    }

    .price{
      font-family:"Barlow Condensed";
      font-size:65px;
      font-weight:900;
      margin:25px 0;
    }

    .price span{
      font-family:Inter;
      font-size:12px;
      color:#666;
    }

    .price-card ul{
      list-style:none;
      border-top:1px solid #222;
      padding-top:20px;
    }

    .price-card li{
      padding:10px 0;
      color:#888;
      font-size:13px;
    }

    .price-card li:before{
      content:"✓";
      color:var(--orange);
      margin-right:10px;
    }

    .price-btn{
      display:block;
      margin-top:30px;
      text-align:center;
      border:1px solid #333;
      padding:14px;
      font-size:11px;
      font-weight:800;
      text-transform:uppercase;
    }

    .featured .price-btn{
      background:var(--orange);
      color:#000;
      border-color:var(--orange);
    }

    /* TRAINERS */

    .trainer-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:20px;
    }

    .trainer{
      background:#111;
      min-height:390px;
      padding:25px;
      border:1px solid #222;
      position:relative;
      overflow:hidden;
    }

    .trainer:before{
      content:"";
      position:absolute;
      width:170px;
      height:170px;
      background:var(--orange);
      border-radius:50%;
      filter:blur(80px);
      opacity:.15;
      right:-50px;
      top:-50px;
    }

    .trainer-avatar{
      height:230px;
      background:
        linear-gradient(135deg,#222,#0d0d0d);
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:"Barlow Condensed";
      font-size:100px;
      font-weight:900;
      color:#333;
    }

    .trainer h3{
      font-family:"Barlow Condensed";
      font-size:30px;
      text-transform:uppercase;
      margin-top:20px;
    }

    .trainer p{
      color:var(--orange);
      font-size:10px;
      letter-spacing:2px;
      text-transform:uppercase;
      margin-top:5px;
    }

    /* CTA */

    .cta{
      background:var(--orange);
      color:#000;
      padding:80px;
      position:relative;
      overflow:hidden;
    }

    .cta:after{
      content:"X";
      position:absolute;
      right:30px;
      top:-90px;
      font-family:"Barlow Condensed";
      font-size:400px;
      font-weight:900;
      opacity:.08;
    }

    .cta h2{
      font-size:90px;
      max-width:700px;
    }

    .cta p{
      max-width:520px;
      margin:20px 0 30px;
      line-height:1.7;
      color:#222;
    }

    .black-btn{
      background:#000;
      color:#fff;
      display:inline-block;
      padding:16px 28px;
      font-size:11px;
      font-weight:900;
      text-transform:uppercase;
    }

    /* CONTACT */

    .contact{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:60px;
    }

    .contact-info h2{
      margin-bottom:25px;
    }

    .contact-info p{
      color:#777;
      line-height:1.8;
      max-width:450px;
    }

    .contact-detail{
      margin-top:30px;
    }

    .contact-detail div{
      padding:16px 0;
      border-bottom:1px solid #222;
      color:#999;
      font-size:13px;
    }

    .contact-detail strong{
      color:#fff;
      display:inline-block;
      width:100px;
    }

    form{
      background:#111;
      padding:35px;
      border:1px solid #222;
    }

    input,textarea{
      width:100%;
      background:#0b0b0b;
      border:1px solid #292929;
      color:#fff;
      padding:16px;
      margin-bottom:12px;
      outline:none;
      font-family:Inter;
    }

    input:focus,textarea:focus{
      border-color:var(--orange);
    }

    textarea{
      height:130px;
      resize:none;
    }

    form button{
      width:100%;
      border:0;
      padding:17px;
      background:var(--orange);
      font-weight:900;
      text-transform:uppercase;
      cursor:pointer;
    }

    /* FOOTER */

    footer{
      padding:35px 0;
      border-top:1px solid #222;
      color:#555;
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:1px;
    }

    .footer-inner{
      display:flex;
      justify-content:space-between;
    }

    /* REVEAL */

    .reveal{
      opacity:0;
      transform:translateY(35px);
      transition:1s ease;
    }

    .reveal.active{
      opacity:1;
      transform:translateY(0);
    }

      .nav-links{
        display:none;
      }
